<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Circular White / Light Backing -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Top Red / Coral Arch ("O" / Rising Sun) -->
  <path 
    d="M 250 40 
       C 350 40, 430 115, 435 215 
       C 437 260, 420 290, 395 305 
       C 365 255, 315 220, 250 220 
       C 185 220, 135 255, 105 305 
       C 80 290, 63 260, 65 215 
       C 70 115, 150 40, 250 40 Z" 
    fill="#FF3B44" 
  />
  
  <!-- Outer smooth arc and inner circular cutout for the coral ring -->
  <mask id="coralMask">
    <rect width="500" height="500" fill="white" />
    <circle cx="250" cy="240" r="110" fill="black" />
  </mask>
  
  <g mask="url(#coralMask)">
    <path 
      d="M 60 260 C 60 145, 145 60, 250 60 C 355 60, 440 145, 440 260 C 440 300, 420 310, 395 305 C 380 230, 320 180, 250 180 C 180 180, 120 230, 105 305 C 80 310, 60 300, 60 260 Z"
      fill="#FF383D"
    />
  </g>

  <!-- Bottom Blue Open Book Shape -->
  <path 
    d="M 250 370 
       C 320 310, 400 305, 460 290 
       L 460 375 
       C 390 395, 320 400, 250 470 
       C 180 400, 110 395, 40 375 
       L 40 290 
       C 100 305, 180 310, 250 370 Z" 
    fill="#25ABE2" 
  />
</svg>
